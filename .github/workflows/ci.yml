name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secret_sanchez_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      PUBLIC_SUPABASE_URL: https://project.example.invalid
      PUBLIC_SUPABASE_ANON_KEY: isolated-ci-placeholder
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/secret_sanchez_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/secret_sanchez_test
      APP_URL: https://app.example.invalid
      REVEAL_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run db:check
      - run: npm audit --omit=dev --audit-level=high
